<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GREEK ISLAND GUIDE</title>
<link rel="stylesheet" href="styles.css">
<style>
  body{overflow:hidden;}
  .splash{
    height:100vh;width:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#EAF6FF 0%, #FFFFFF 100%);
    position:relative;text-align:center;
  }
  .splash-lang{position:absolute;top:26px;right:28px;}
  .ship-wrap{width:220px;height:160px;margin-bottom:18px;animation:bob 3.6s ease-in-out infinite;}
  .ship-wrap svg{width:100%;height:100%;}
  @keyframes bob{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
  }
  .splash h1{
    font-family:'Fraunces',serif;font-weight:500;font-size:34px;color:var(--sea-deep);
    margin:0 0 10px;letter-spacing:-0.01em;
  }
  .splash p{color:var(--ink-soft);font-size:15px;margin:0 0 30px;}
  .splash .enter{
    display:inline-flex;align-items:center;gap:8px;padding:14px 30px;border-radius:999px;
    background:var(--sea);color:#fff;font-weight:500;font-size:14.5px;transition:transform .18s ease, box-shadow .18s ease;
  }
  .splash .enter:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(11,95,165,0.32);}
  .splash .brand{
    position:absolute;bottom:26px;font-family:'IBM Plex Mono',monospace;font-size:12px;
    letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-soft);
  }
</style>
</head>
<body>

<div class="splash">
  <button class="lang-toggle splash-lang" onclick="toggleLang()"><span class="lang-label">ΕΛ</span></button>

  <div class="ship-wrap">
    <svg viewBox="0 0 220 160" xmlns="http://www.w3.org/2000/svg">
      <path d="M30 108 C 60 96, 160 96, 190 108 L 172 132 C 140 122, 80 122, 48 132 Z" fill="#0B5FA5"/>
      <rect x="98" y="46" width="6" height="58" fill="#0A3D66"/>
      <path d="M104 52 L150 78 L104 88 Z" fill="#4FA8DA"/>
      <path d="M98 58 L64 82 L98 90 Z" fill="#EAF6FF" stroke="#0A3D66" stroke-width="1.5"/>
      <rect x="70" y="100" width="16" height="10" rx="2" fill="#0A3D66"/>
      <rect x="130" y="100" width="16" height="10" rx="2" fill="#0A3D66"/>
      <path d="M10 122 C 30 116, 45 128, 65 122 S 100 116, 120 122 S 155 128, 175 122 S 200 116, 215 122" fill="none" stroke="#4FA8DA" stroke-width="2" stroke-linecap="round"/>
      <path d="M0 134 C 22 128, 40 140, 62 134 S 100 128, 122 134 S 158 140, 180 134 S 205 128, 220 134" fill="none" stroke="#DCEFFB" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>

  <h1 data-en="Home" data-el="Αρχική">Home</h1>
  <p data-en="Click to explore the Greek islands" data-el="Πάτα για να εξερευνήσεις τα ελληνικά νησιά">Click to explore the Greek islands</p>
  <a class="enter" href="main.html" data-en="Enter" data-el="Είσοδος">Enter</a>

  <span class="brand"><b>GREEK</b>-ISLAND-GUIDE</span>
</div>

<script src="i18n.js"></script>
</body>
</html>
